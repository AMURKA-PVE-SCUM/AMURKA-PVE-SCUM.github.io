- generic [active] [ref=f4e1]: "/* ═══════════════════════════════════════════════ AMURKA API — SSM data bridge Fetches from ssm-*.json files generated by sync-ssm.js Falls back to old static files when SSM data unavailable ═══════════════════════════════════════════════ */ window.AmurkaAPI = (() => { const pathParts = window.location.pathname.split('/').filter(Boolean); const base = pathParts.length >= 1 ? '../data/' : 'data/'; async function fetchJSON(filename) { try { const res = await fetch(base + filename, { cache: 'no-store' }); if (!res.ok) return null; return await res.json(); } catch { return null; } } // Server status — prefer ssm-status.json, fallback to server-status.json async function getServerStatus() { const ssm = await fetchJSON('ssm-status.json'); if (ssm) return { online: ssm.online, players: ssm.players, maxPlayers: ssm.maxPlayers, uptime: ssm.uptime || 0, memoryUsage: ssm.memoryUsage || 0, source: 'ssm', updated: ssm.updated, }; const legacy = await fetchJSON('server-status.json'); if (legacy) return { online: legacy.online, players: legacy.players, maxPlayers: legacy.maxPlayers || 100, uptime: 0, memoryUsage: 0, source: legacy.source || 'legacy', updated: legacy.updated, }; return { online: false, players: 0, maxPlayers: 100, uptime: 0, memoryUsage: 0, source: 'none' }; } // Online players async function getOnlinePlayers() { const ssm = await fetchJSON('ssm-players.json'); if (ssm && ssm.players) return { players: ssm.players, source: 'ssm', updated: ssm.updated }; return { players: [], source: 'none' }; } // Vehicles async function getVehicles() { const ssm = await fetchJSON('ssm-vehicles.json'); if (ssm && ssm.vehicles) return { vehicles: ssm.vehicles, source: 'ssm', updated: ssm.updated }; return { vehicles: [], source: 'none' }; } // Flags (territories) async function getFlags() { const ssm = await fetchJSON('ssm-flags.json'); if (ssm && ssm.flags) return { flags: ssm.flags, source: 'ssm', updated: ssm.updated }; return { flags: [], source: 'none' }; } // Rating leaderboard async function getRating() { const ssm = await fetchJSON('ssm-rating.json'); if (ssm && ssm.leaderboard) return { leaderboard: ssm.leaderboard, totalOnlineSeconds: ssm.totalOnlineSeconds || 0, source: 'ssm', updated: ssm.updated, }; return { leaderboard: [], totalOnlineSeconds: 0, source: 'none' }; } // LOLKA bot status async function getBotStatus() { const ssm = await fetchJSON('ssm-bot.json'); if (ssm) return { running: ssm.running || false, source: 'ssm', updated: ssm.updated }; return { running: false, source: 'none' }; } // News (unchanged — from static JSON) async function getNews() { const news = await fetchJSON('news.json'); return news || []; } // Screenshots (unchanged) async function getScreenshots() { const ss = await fetchJSON('screenshots.json'); return ss || []; } // Streamers (unchanged) async function getStreamers() { const s = await fetchJSON('streamers.json'); return s || []; } return { getServerStatus, getOnlinePlayers, getVehicles, getFlags, getRating, getBotStatus, getNews, getScreenshots, getStreamers, }; })();"